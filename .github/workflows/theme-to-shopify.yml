# main -> shopify-live: when theme/ changes on main, rebuild shopify-live (which Shopify follows).
name: Sync theme to Shopify

on:
  push:
    branches: [main]
    paths: ["theme/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: theme-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/scripts/theme-sync.sh
